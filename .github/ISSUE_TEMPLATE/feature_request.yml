name: Feature request
description: Suggest something tMinus should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are in, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried instead?
